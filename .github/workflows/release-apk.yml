name: Build & Release APK

# Kích hoạt workflow khi:
# 1. Push một Tag bắt đầu bằng chữ "v" (VD: v1.0.0, v1.0.1)
# 2. Chạy thủ công bằng tay từ giao diện web GitHub Actions (workflow_dispatch)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    # POLICY QUAN TRỌNG: Cấp quyền Ghi (Write) cho GitHub Token 
    # để bot có thể tự động tạo Release và Upload file APK lên Repo.
    permissions:
      contents: write

    steps:
      # 1. Checkout mã nguồn từ Repo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Java (Bắt buộc cho Gradle của Android)
      # Không bật cache: 'gradle' ở đây để tránh xung đột với gradle/actions/setup-gradle@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17' # Tương thích tốt nhất với Gradle mới

      # 3. Cài đặt môi trường Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Bật cache SDK Flutter để build nhanh hơn ở các lần sau

      # 3b. Cache Pub packages & Gradle build cache để tăng tốc độ release
      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # Trên tag build chỉ đọc cache từ nhánh main (không tốn ~35s upload cache riêng của tag mà tag sau không đọc được)
          cache-read-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      # 3c. Tận dụng Android NDK có sẵn trên ubuntu-latest để KHÔNG tốn ~2-3 phút tải & giải nén NDK 28.2 mỗi lần build
      - name: Use Pre-installed Android NDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_VER=$(basename "$ANDROID_NDK_LATEST_HOME")
          elif [ -d "$SDK_DIR/ndk" ]; then
            NDK_VER=$(ls -1 "$SDK_DIR/ndk" | sort -V | tail -n 1)
          fi
          if [ -n "$NDK_VER" ]; then
            echo "ANDROID_NDK_VERSION=${NDK_VER}" >> "$GITHUB_ENV"
            echo "Using pre-installed Android NDK: ${NDK_VER} (from ${SDK_DIR}/ndk)"
          else
            echo "No pre-installed NDK found in ${SDK_DIR}/ndk, falling back to flutter.ndkVersion"
          fi

      # 4. Tải các gói phụ thuộc
      - name: Install Dependencies
        run: flutter pub get

      # 4b. Giải mã & kiểm tra file Keystore (Chữ ký ứng dụng) từ GitHub Secrets
      # Kiểm tra ngay bằng keytool để nếu sai mật khẩu/base64 thì báo lỗi trong 1 giây thay vì chờ build 5 phút
      - name: Decode & Verify Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/upload-keystore.jks
            ls -lh android/app/upload-keystore.jks
            if ! keytool -list -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error::Keystore verification FAILED! Hãy kiểm tra lại 4 GitHub Secrets: KEYSTORE_BASE64 (copy từ keystore-base64.txt mới nhất), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
              exit 1
            fi
            echo "Keystore verified OK (alias matched)."
          else
            echo "::warning::KEYSTORE_BASE64 is empty! APK will be signed with ephemeral debug key and CANNOT update over previous installs."
          fi

      # 4c. Tự động tính build-name và build-number tăng dần theo Tag (VD: v1.0.19 -> build-name=1.0.19, build-number=10019)
      # Giúp Android nhận diện bản mới luôn cao hơn bản cũ và cho phép bấm "Cập nhật" (cài đè) giữ nguyên dữ liệu
      - name: Resolve Version from Tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            BUILD_NUMBER=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
            BUILD_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          fi
          echo "build_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Resolved Android version: ${VERSION_NAME} (versionCode=${BUILD_NUMBER})"

      # 5. Build file APK với Release Keystore (chỉ build arm64-v8a phổ biến giúp giảm ~50% thời gian biên dịch AOT)
      - name: Build APK
        run: >
          flutter build apk --release
          --no-pub
          --target-platform android-arm64
          --build-name=${{ steps.version.outputs.build_name }}
          --build-number=${{ steps.version.outputs.build_number }}
          --dart-define=APP_VERSION=${{ steps.version.outputs.build_name }}
          -t lib/app/main.dart
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && 'upload-keystore.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 6a. NẾU CÓ TAG (VD: git push origin v1.0.0): Tự động tạo Release và đính kèm APK
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6b. NẾU CHẠY THỦ CÔNG (Không có Tag): Upload APK lên Artifacts để tải về tạm thời
      - name: Upload APK as Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: AnalogAI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
